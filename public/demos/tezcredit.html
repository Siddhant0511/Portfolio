<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tez Credit — Instant Personal Loan</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
--ink:#0A1628;--ink-soft:#1A2942;--paper:#FBFAF7;--paper-warm:#F3F0E9;
--saffron:#FF6B35;--saffron-dark:#E4551F;--saffron-soft:#FFF0E8;
--indigo:#2D3E8C;--indigo-light:#4557B5;--indigo-soft:#EEF0FB;
--teal:#0E8388;--teal-soft:#E3F4F4;
--green:#178A4C;--green-soft:#E6F5EC;--red:#C43D3D;--red-soft:#FBEBEB;--amber:#D98A00;--amber-soft:#FCF3E0;
--line:#E5E1D8;--line-soft:#EFEBE2;--muted:#6B7280;--muted-soft:#9AA1AC;
--shadow:0 4px 24px rgba(10,22,40,0.08);--shadow-lg:0 12px 48px rgba(10,22,40,0.14);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:radial-gradient(ellipse at 30% 20%,#12203a 0%,#070d18 55%,#03060d 100%);display:flex;align-items:center;justify-content:center;min-height:100vh;font-family:'Inter',system-ui,sans-serif;overflow:hidden;color:var(--ink);padding:0;}
#bgParticles{position:fixed;inset:0;z-index:0;pointer-events:none;}
.device{position:relative;z-index:2;width:404px;height:872px;max-height:calc(100vh - 20px);border-radius:58px;background:linear-gradient(145deg,#3a3d44 0%,#1c1e22 18%,#2a2d33 50%,#16181c 82%,#34373d 100%);padding:11px;box-shadow:0 0 0 1px rgba(255,255,255,.06),0 30px 80px rgba(0,0,0,.7),0 8px 20px rgba(0,0,0,.5),inset 0 0 3px rgba(255,255,255,.15);}
.device::before{content:'';position:absolute;left:-3px;top:150px;width:3px;height:30px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#0c0d0f,#2c2f35);}
.device::after{content:'';position:absolute;left:-3px;top:205px;width:3px;height:52px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#0c0d0f,#2c2f35);}
.device-rail-r{position:absolute;right:-3px;top:225px;width:3px;height:72px;border-radius:0 3px 3px 0;background:linear-gradient(270deg,#0c0d0f,#2c2f35);z-index:3;}
.device-rail-l2{position:absolute;left:-3px;top:275px;width:3px;height:52px;border-radius:3px 0 0 3px;background:linear-gradient(90deg,#0c0d0f,#2c2f35);z-index:3;}
.phone{width:100%;height:100%;background:var(--paper);position:relative;overflow:hidden;display:flex;flex-direction:column;border-radius:47px;}
.dynamic-island{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:118px;height:34px;background:#000;border-radius:20px;z-index:60;display:flex;align-items:center;justify-content:flex-end;padding-right:12px;}
.di-cam{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#2a3a55,#05070d 70%);box-shadow:inset 0 0 2px rgba(80,120,200,.6);position:relative;}
.di-cam::after{content:'';position:absolute;inset:3px;border-radius:50%;background:rgba(90,140,230,.35);}
@media(max-width:430px){.device{width:100vw;height:100vh;max-height:none;border-radius:0;padding:0;box-shadow:none;}.device::before,.device::after,.device-rail-r{display:none;}.phone{border-radius:0;}}
.statusbar{display:flex;justify-content:space-between;align-items:center;padding:16px 26px 8px;font-size:13px;font-weight:700;color:var(--ink);flex-shrink:0;font-variant-numeric:tabular-nums;}
.statusbar-r{display:flex;gap:5px;align-items:center;font-size:11px;}
.topbar{display:flex;align-items:center;gap:12px;padding:8px 20px 12px;flex-shrink:0;}
.back{width:36px;height:36px;border-radius:12px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:17px;color:var(--ink);transition:all .18s;flex-shrink:0;}
.back:hover{background:var(--paper-warm);}.back:active{transform:scale(.9);}
.back.hidden{visibility:hidden;}
.brand{display:flex;align-items:center;gap:8px;}
.brand-mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--saffron),var(--saffron-dark));display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 10px rgba(255,107,53,.35);}
.brand-mark svg{width:17px;height:17px;}
.brand-name{font-family:'Sora',sans-serif;font-weight:800;font-size:17px;letter-spacing:-.5px;color:var(--ink);}
.brand-name .t{color:var(--saffron);}
.brand-tag{font-size:8px;font-weight:700;letter-spacing:1px;color:var(--muted-soft);text-transform:uppercase;margin-top:-2px;}
.progress-wrap{padding:0 20px 4px;flex-shrink:0;}
.progress-track{height:3px;background:var(--line-soft);border-radius:2px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--saffron),var(--indigo));border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1);}
.progress-label{display:flex;justify-content:space-between;margin-top:5px;font-size:10px;color:var(--muted-soft);font-weight:600;}
.screen{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--line) transparent;}
.screen::-webkit-scrollbar{width:4px;}.screen::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
.pad{padding:8px 20px 28px;}
.step-anim{animation:slideIn .4s cubic-bezier(.16,1,.3,1);}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:translateX(0)}}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--saffron);margin-bottom:8px;}
.h1{font-family:'Sora',sans-serif;font-size:26px;font-weight:800;line-height:1.15;letter-spacing:-.6px;color:var(--ink);}
.h2{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;letter-spacing:-.3px;color:var(--ink);}
.sub{font-size:13px;color:var(--muted);line-height:1.55;margin-top:8px;}
.mono{font-family:'JetBrains Mono',monospace;}
/* Landing */
.hero{background:linear-gradient(150deg,var(--ink) 0%,var(--ink-soft) 100%);border-radius:24px;padding:26px 22px;color:#fff;position:relative;overflow:hidden;margin-bottom:18px;}
.hero-glow{position:absolute;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,53,.4),transparent 70%);top:-70px;right:-50px;}
.hero-glow2{position:absolute;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(69,87,181,.35),transparent 70%);bottom:-60px;left:-40px;}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:100px;padding:5px 12px;font-size:11px;font-weight:600;margin-bottom:16px;position:relative;}
.hero-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
.hero h1{font-family:'Sora',sans-serif;font-size:29px;font-weight:800;line-height:1.1;letter-spacing:-.8px;position:relative;}
.hero h1 .amt{color:var(--saffron);}
.hero p{font-size:13px;color:rgba(255,255,255,.65);margin-top:10px;line-height:1.5;position:relative;}
.hero-stats{display:flex;gap:0;margin-top:20px;position:relative;}
.hero-stat{flex:1;}
.hero-stat+.hero-stat{border-left:1px solid rgba(255,255,255,.12);padding-left:14px;}
.hero-stat .v{font-family:'Sora',sans-serif;font-size:19px;font-weight:700;}
.hero-stat .l{font-size:10px;color:rgba(255,255,255,.5);margin-top:2px;}
.stack-row{display:flex;gap:8px;margin-bottom:18px;}
.stack-pill{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center;transition:all .2s;}
.stack-pill .ic{font-size:20px;}
.stack-pill .nm{font-size:10px;font-weight:700;color:var(--ink);margin-top:5px;}
.stack-pill .ds{font-size:8px;color:var(--muted-soft);margin-top:1px;}
.feature-list{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:20px;}
.feature{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line-soft);}
.feature:last-child{border-bottom:none;}
.feature-ic{width:36px;height:36px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.feature-tx .t{font-size:13px;font-weight:600;color:var(--ink);}
.feature-tx .d{font-size:11px;color:var(--muted);margin-top:1px;}
/* Buttons */
.btn{width:100%;border:none;border-radius:14px;padding:16px;font-size:15px;font-weight:700;font-family:'Inter',sans-serif;cursor:pointer;transition:all .2s;display:flex;align-items:center;justify-content:center;gap:8px;}
.btn:active{transform:scale(.97);}
.btn-primary{background:linear-gradient(135deg,var(--saffron),var(--saffron-dark));color:#fff;box-shadow:0 6px 20px rgba(255,107,53,.32);}
.btn-primary:hover{box-shadow:0 8px 28px rgba(255,107,53,.42);}
.btn-primary:disabled{background:var(--line);color:var(--muted-soft);box-shadow:none;cursor:not-allowed;}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:var(--ink-soft);}
.btn-ghost{background:#fff;border:1.5px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--muted-soft);}
.btn-sm{padding:12px;font-size:13px;border-radius:12px;}
/* Amount slider */
.amt-display{text-align:center;padding:20px 0 8px;}
.amt-value{font-family:'Sora',sans-serif;font-size:44px;font-weight:800;letter-spacing:-1.5px;color:var(--ink);}
.amt-value .r{color:var(--saffron);}
.amt-label{font-size:12px;color:var(--muted);margin-top:2px;}
.slider-wrap{padding:20px 4px;}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:4px;background:linear-gradient(90deg,var(--saffron) var(--pct,50%),var(--line) var(--pct,50%));outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--saffron);cursor:pointer;box-shadow:0 3px 10px rgba(255,107,53,.4);transition:transform .1s;}
input[type=range]::-webkit-slider-thumb:active{transform:scale(1.15);}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--saffron);cursor:pointer;}
.slider-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted-soft);font-weight:600;margin-top:8px;}
.chips{display:flex;gap:8px;margin:16px 0;}
.chip{flex:1;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;cursor:pointer;transition:all .18s;}
.chip:hover{border-color:var(--saffron);}
.chip.active{background:var(--saffron-soft);border-color:var(--saffron);}
.chip .p{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:700;color:var(--ink);}
.chip .m{font-size:10px;color:var(--muted);margin-top:2px;}
.tenure-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 20px;}
.tenure{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 4px;text-align:center;cursor:pointer;transition:all .18s;}
.tenure:hover{border-color:var(--indigo);}
.tenure.active{background:var(--indigo-soft);border-color:var(--indigo);}
.tenure .n{font-family:'Sora',sans-serif;font-size:18px;font-weight:700;color:var(--ink);}
.tenure .u{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.emi-preview{background:var(--ink);border-radius:16px;padding:18px;color:#fff;margin-bottom:20px;display:flex;justify-content:space-between;align-items:center;}
.emi-preview .lbl{font-size:11px;color:rgba(255,255,255,.55);}
.emi-preview .val{font-family:'Sora',sans-serif;font-size:24px;font-weight:700;margin-top:3px;}
.emi-preview .rt{text-align:right;}
.emi-preview .rt .v{font-family:'JetBrains Mono',monospace;font-size:14px;font-weight:600;}
/* Profile cards */
.profile-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:10px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;}
.profile-card:hover{border-color:var(--saffron);transform:translateY(-2px);box-shadow:var(--shadow);}
.profile-card.active{border-color:var(--saffron);background:var(--saffron-soft);}
.profile-av{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;}
.profile-tx{flex:1;min-width:0;}
.profile-nm{font-size:15px;font-weight:700;color:var(--ink);}
.profile-ds{font-size:11px;color:var(--muted);margin-top:2px;line-height:1.4;}
.profile-meta{display:flex;gap:8px;margin-top:6px;}
.profile-tag{font-size:9px;font-weight:600;padding:2px 7px;border-radius:6px;background:var(--paper-warm);color:var(--muted);}
.profile-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .2s;}
.profile-card.active .profile-radio{border-color:var(--saffron);background:var(--saffron);}
.profile-card.active .profile-radio::after{content:'✓';color:#fff;font-size:12px;font-weight:700;}
/* Form fields */
.field{margin-bottom:16px;}
.field-label{font-size:12px;font-weight:600;color:var(--ink);margin-bottom:7px;display:flex;justify-content:space-between;}
.field-label .hint{color:var(--muted-soft);font-weight:500;}
.input{width:100%;background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px;font-family:'JetBrains Mono',monospace;color:var(--ink);transition:all .18s;letter-spacing:1px;}
.input:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft);}
.input::placeholder{color:var(--muted-soft);letter-spacing:1px;}
.input.text-input{font-family:'Inter',sans-serif;letter-spacing:0;}
/* OTP */
.otp-row{display:flex;gap:10px;justify-content:center;margin:20px 0;}
.otp-box{width:46px;height:56px;background:#fff;border:1.5px solid var(--line);border-radius:12px;text-align:center;font-size:24px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--ink);transition:all .18s;}
.otp-box:focus{outline:none;border-color:var(--saffron);box-shadow:0 0 0 3px var(--saffron-soft);}
.otp-box.filled{border-color:var(--indigo);background:var(--indigo-soft);}
.otp-info{text-align:center;font-size:12px;color:var(--muted);margin-bottom:8px;}
.otp-resend{text-align:center;font-size:12px;color:var(--saffron);font-weight:600;cursor:pointer;margin-top:14px;}
.demo-hint{background:var(--amber-soft);border:1px dashed var(--amber);border-radius:10px;padding:8px 12px;font-size:11px;color:var(--amber);text-align:center;margin-bottom:12px;font-weight:600;}
/* Aadhaar/verification cards */
.verify-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
.aadhaar-visual{background:linear-gradient(135deg,#fff,var(--paper-warm));border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px;position:relative;overflow:hidden;}
.aadhaar-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
.aadhaar-emblem{display:flex;align-items:center;gap:8px;}
.aadhaar-emblem .em{font-size:22px;}
.aadhaar-emblem .tx .t1{font-size:9px;font-weight:700;color:var(--ink);}
.aadhaar-emblem .tx .t2{font-size:7px;color:var(--muted);}
.uidai-logo{font-size:8px;font-weight:700;color:var(--saffron);text-align:right;line-height:1.3;}
.aadhaar-body{display:flex;gap:14px;align-items:center;}
.aadhaar-photo{width:56px;height:66px;border-radius:8px;background:var(--indigo-soft);display:flex;align-items:center;justify-content:center;font-size:30px;flex-shrink:0;border:1px solid var(--line);}
.aadhaar-info .nm{font-size:15px;font-weight:700;color:var(--ink);}
.aadhaar-info .dt{font-size:11px;color:var(--muted);margin-top:2px;}
.aadhaar-num{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;letter-spacing:3px;color:var(--ink);margin-top:10px;text-align:center;padding-top:10px;border-top:1px dashed var(--line);}
/* Fetch animation */
.fetch-item{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;transition:all .3s;}
.fetch-item.done{border-color:var(--green);background:var(--green-soft);}
.fetch-ic{width:40px;height:40px;border-radius:11px;background:var(--paper-warm);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.fetch-item.done .fetch-ic{background:#fff;}
.fetch-tx{flex:1;}
.fetch-tx .t{font-size:13px;font-weight:600;color:var(--ink);}
.fetch-tx .d{font-size:11px;color:var(--muted);margin-top:1px;}
.fetch-status{flex-shrink:0;}
.spinner{width:20px;height:20px;border:2.5px solid var(--line);border-top-color:var(--saffron);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.check{width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;animation:pop .3s cubic-bezier(.16,1.4,.5,1);}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
/* Data review rows */
.data-card{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:14px;}
.data-card-head{padding:13px 16px;background:var(--paper-warm);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;}
.data-card-head .ic{font-size:16px;}
.data-card-head .t{font-size:12px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.5px;}
.data-card-head .verified{margin-left:auto;font-size:9px;font-weight:700;color:var(--green);background:var(--green-soft);padding:3px 8px;border-radius:6px;display:flex;align-items:center;gap:3px;}
.data-row{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);}
.data-row:last-child{border-bottom:none;}
.data-row .k{font-size:12px;color:var(--muted);}
.data-row .v{font-size:13px;font-weight:600;color:var(--ink);text-align:right;}
/* Credit assessment */
.gauge-wrap{display:flex;flex-direction:column;align-items:center;padding:10px 0 20px;}
.gauge-score{font-family:'Sora',sans-serif;font-size:40px;font-weight:800;color:var(--ink);margin-top:-70px;}
.gauge-label{font-size:12px;font-weight:600;color:var(--muted);}
.assess-list{margin:16px 0;}
.assess-row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px;}
.assess-ic{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;}
.assess-tx{flex:1;}
.assess-tx .t{font-size:13px;font-weight:600;color:var(--ink);}
.assess-tx .d{font-size:11px;color:var(--muted);margin-top:1px;}
.assess-val{font-size:12px;font-weight:700;font-family:'JetBrains Mono',monospace;}
/* Decision */
.decision-hero{border-radius:20px;padding:26px 22px;text-align:center;margin-bottom:18px;position:relative;overflow:hidden;}
.decision-hero.approved{background:linear-gradient(150deg,var(--green),#0F6E3C);color:#fff;}
.decision-hero.review{background:linear-gradient(150deg,var(--amber),#B87400);color:#fff;}
.decision-hero.declined{background:linear-gradient(150deg,var(--ink),var(--ink-soft));color:#fff;}
.decision-icon{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;font-size:32px;margin:0 auto 14px;animation:pop .4s cubic-bezier(.16,1.4,.5,1);}
.decision-hero h2{font-family:'Sora',sans-serif;font-size:24px;font-weight:800;}
.decision-hero p{font-size:13px;opacity:.85;margin-top:8px;line-height:1.5;}
.offer-amt{font-family:'Sora',sans-serif;font-size:36px;font-weight:800;margin-top:6px;}
.offer-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.offer-box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px;}
.offer-box .k{font-size:11px;color:var(--muted);}
.offer-box .v{font-family:'Sora',sans-serif;font-size:20px;font-weight:700;color:var(--ink);margin-top:3px;}
.offer-box .s{font-size:10px;color:var(--muted-soft);margin-top:2px;}
/* Agreement */
.agreement-doc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px;max-height:200px;overflow-y:auto;font-size:11px;color:var(--muted);line-height:1.7;}

.consent.checked .consent-box{background:var(--indigo);}
.consent.checked .consent-box::after{content:'✓';color:#fff;font-size:13px;font-weight:700;}
.consent-tx{font-size:12px;color:var(--ink);line-height:1.5;}
/* eSign */
.esign-pad{background:#fff;border:2px dashed var(--line);border-radius:14px;height:140px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;position:relative;cursor:crosshair;overflow:hidden;}
.esign-hint{color:var(--muted-soft);font-size:13px;pointer-events:none;}
/* Disbursement */
.disburse-visual{text-align:center;padding:20px 0;}
.upi-flow{display:flex;align-items:center;justify-content:center;gap:0;margin:24px 0;}
.upi-node{display:flex;flex-direction:column;align-items:center;gap:6px;}
.upi-node .circ{width:56px;height:56px;border-radius:16px;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:24px;box-shadow:var(--shadow);}
.upi-node .lb{font-size:10px;color:var(--muted);font-weight:600;}
.upi-line{flex:1;height:2px;background:var(--line);position:relative;margin:0 4px;margin-bottom:22px;overflow:hidden;}
.upi-line .pulse{position:absolute;width:20px;height:100%;background:linear-gradient(90deg,transparent,var(--saffron),transparent);animation:flow 1.2s linear infinite;}
@keyframes flow{from{left:-20px}to{left:100%}}
.success-amt{font-family:'Sora',sans-serif;font-size:40px;font-weight:800;color:var(--green);text-align:center;margin:8px 0;}
.receipt{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px;}
.receipt-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px dashed var(--line-soft);font-size:12px;}
.receipt-row:last-child{border-bottom:none;}
.receipt-row .k{color:var(--muted);}
.receipt-row .v{font-weight:600;color:var(--ink);font-family:'JetBrains Mono',monospace;}
.confetti{position:absolute;width:8px;height:8px;top:-10px;animation:fall 2.5s linear forwards;z-index:5;}
@keyframes fall{to{transform:translateY(900px) rotate(720deg);opacity:0;}}
.badge-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
.trust-badge{font-size:9px;font-weight:600;color:var(--muted);background:#fff;border:1px solid var(--line);border-radius:8px;padding:5px 9px;display:flex;align-items:center;gap:4px;}
.timeline{margin:16px 0;}
.tl-item{display:flex;gap:12px;padding-bottom:16px;position:relative;}
.tl-item:last-child{padding-bottom:0;}
.tl-item::before{content:'';position:absolute;left:11px;top:26px;bottom:0;width:2px;background:var(--line);}
.tl-item:last-child::before{display:none;}
.tl-dot{width:24px;height:24px;border-radius:50%;background:var(--green);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;flex-shrink:0;z-index:1;}
.tl-tx .t{font-size:13px;font-weight:600;color:var(--ink);}
.tl-tx .d{font-size:11px;color:var(--muted);margin-top:1px;}
.info-note{display:flex;gap:8px;background:var(--teal-soft);border-radius:10px;padding:10px 12px;font-size:11px;color:var(--teal);line-height:1.5;margin-bottom:14px;}
.qr-box{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-bottom:14px;}
.spacer{height:8px;}
/* ── SVG icon system ── */
.ico{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;}
.ico svg{width:1em;height:1em;display:block;}
.feature-ic .ico svg,.data-card-head .ic .ico svg,.assess-ic .ico svg,.profile-av .ico svg{width:1.1em;height:1.1em;}
.feature-ic{font-size:17px;}.profile-av{font-size:22px;}.assess-ic{font-size:15px;}
.data-card-head .ic{font-size:16px;display:inline-flex;color:var(--muted);}
.stack-pill .ic{font-size:22px;display:flex;justify-content:center;}
.ic-saffron{color:var(--saffron);}.ic-indigo{color:var(--indigo);}.ic-green{color:var(--green);}
.btn .ico{font-size:17px;}.btn .ico svg{width:17px;height:17px;}
.verified .ico{font-size:11px;}
.trust-badge .ico{font-size:11px;}
.tl-dot .ico{font-size:12px;}.decision-icon .ico{font-size:30px;}
.decision-icon .ico svg{width:32px;height:32px;}
.upi-node .circ{font-size:22px;color:var(--ink);}
.fetch-ic{color:var(--muted);}.fetch-ic .ico{font-size:17px;}
.check .ico{font-size:13px;}.check .ico svg{width:14px;height:14px;}
.info-note .ico{font-size:15px;flex-shrink:0;}
/* ── Simulated banner ── */
.sim-banner{display:flex;align-items:center;gap:8px;background:var(--amber-soft);border:1px solid rgba(217,138,0,.3);border-radius:12px;padding:10px 12px;font-size:11.5px;color:#8a5a00;line-height:1.4;margin-bottom:16px;}
.sim-banner .ico{font-size:16px;flex-shrink:0;color:var(--amber);}
.sim-banner b{color:#6b4600;}
/* ── API mapping card ── */
.api-map{background:var(--ink);border-radius:16px;padding:14px 16px;color:#fff;}
.api-map-head{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;color:rgba(255,255,255,.9);}

.api-map-row{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.08);font-size:12px;}
.api-map-row:last-child{border-bottom:none;}
.api-map-row .k{color:rgba(255,255,255,.6);flex:1;}
.api-map-row .arw{color:var(--saffron);font-weight:700;}
.api-map-row .v{color:#fff;font-weight:600;flex:1;text-align:right;}
/* ── Rupee in words ── */
.amt-words,.offer-words{font-size:11px;color:var(--muted);margin-top:6px;font-style:italic;letter-spacing:.2px;}
.offer-words{color:rgba(255,255,255,.75);}
.amt-display .amt-words{color:var(--muted);}
/* ── OTP / consent error states ── */
.otp-error{text-align:center;font-size:12px;font-weight:600;color:var(--red);margin-top:10px;min-height:16px;display:flex;align-items:center;justify-content:center;gap:5px;}

.otp-box.err{border-color:var(--red)!important;background:var(--red-soft)!important;animation:none;}

.btn:disabled{background:var(--line)!important;color:var(--muted-soft)!important;box-shadow:none!important;cursor:not-allowed;}
/* ── Lender marketplace ── */
.tier-note{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px;}
.tier-chip{font-size:10px;font-weight:700;padding:4px 10px;border-radius:8px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.5px;}
.tier-micro{background:var(--saffron-soft);color:var(--saffron-dark);}
.tier-mid{background:var(--indigo-soft);color:var(--indigo);}
.tier-large{background:var(--teal-soft);color:var(--teal);}
.lender-card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:all .2s;position:relative;}
.lender-card:hover{border-color:var(--saffron);transform:translateY(-2px);box-shadow:var(--shadow);}
.lender-card.active{border-color:var(--saffron);background:var(--saffron-soft);}
.lender-top{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.lender-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.lender-id{flex:1;min-width:0;}
.lender-nm{font-size:14px;font-weight:700;color:var(--ink);}
.lender-ty{font-size:11px;color:var(--muted);margin-top:1px;}
.lender-badge{font-size:9px;font-weight:700;padding:4px 9px;border-radius:7px;white-space:nowrap;flex-shrink:0;text-transform:uppercase;letter-spacing:.3px;}
.lender-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px;}
.ls{background:var(--paper-warm);border-radius:9px;padding:8px 4px;text-align:center;}
.lender-card.active .ls{background:#fff;}
.ls-v{font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:var(--ink);}
.ls-k{font-size:8.5px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.2px;}
.lender-blurb{font-size:11.5px;color:var(--muted);line-height:1.4;}
.lender-radio{position:absolute;top:14px;right:16px;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);transition:all .2s;display:none;}
.lender-strip{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:14px;}
/* ── SPLASH / SLIDE TO OPEN ── */
.splash{position:absolute;inset:0;z-index:50;border-radius:47px;overflow:hidden;background:linear-gradient(165deg,#0d1b30 0%,#0a1424 45%,#050a14 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .6s cubic-bezier(.7,0,.2,1),opacity .5s ease;}
.splash.dismissed{transform:translateY(-100%);opacity:0;pointer-events:none;}

.splash-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;flex:1;justify-content:center;width:100%;padding:0 20px;text-align:center;}
.logo-badge{width:104px;height:104px;border-radius:30px;background:linear-gradient(140deg,#FF6B35,#E4551F 60%,#c4430f);display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 20px 50px rgba(255,107,53,.45),inset 0 2px 6px rgba(255,255,255,.3);animation:logoRise 1s cubic-bezier(.16,1,.3,1);}
@keyframes logoRise{0%{opacity:0;transform:translateY(40px) scale(.7)}100%{opacity:1;transform:translateY(0) scale(1)}}
.logo-badge svg{width:58px;height:58px;filter:drop-shadow(0 3px 6px rgba(0,0,0,.25));}
.logo-badge::after{content:'';position:absolute;inset:-6px;border-radius:36px;border:1px solid rgba(255,107,53,.25);}
@keyframes ring{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.12);opacity:0}}
.logo-spark{position:absolute;width:8px;height:8px;border-radius:50%;background:#FFD9B8;box-shadow:0 0 12px #FF6B35;animation:spark 2.4s ease-in-out infinite;}
.logo-wordmark{font-family:'Sora',sans-serif;font-weight:800;font-size:34px;letter-spacing:-1px;color:#fff;margin-top:26px;animation:fadeUp .8s ease .3s both;white-space:nowrap;text-align:center;width:100%;}

.logo-sub{font-size:12px;letter-spacing:3px;text-transform:uppercase;color:rgba(255,255,255,.4);font-weight:600;margin-top:8px;animation:fadeUp .8s ease .45s both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.logo-tagline{font-size:14px;color:rgba(255,255,255,.55);margin-top:40px;text-align:center;line-height:1.6;max-width:250px;animation:fadeUp .8s ease .6s both;}
.logo-tagline b{color:#fff;font-weight:700;}
/* slide track */
.slide-wrap{position:relative;z-index:2;width:calc(100% - 48px);margin:0 24px 40px;animation:fadeUp .8s ease .8s both;}
.slide-track{position:relative;height:64px;border-radius:34px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);overflow:hidden;display:flex;align-items:center;backdrop-filter:blur(8px);}

ba(0,0,0,.65);color:#fff;border-radius:20px;padding:6px 10px;font-size:10px}.match-card{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin-bottom:12px;font-size:10px}.match-card div:first-child{display:flex;flex-direction:column;gap:3px}.match-card span{color:var(--muted)}.match-card #matchStatus{font-weight:800;color:var(--green)}@keyframes scan{0%{top:22%}50%{top:72%}100%{top:22%}}

// ── Particle field factory (lively, connected, drifting) ──
function makeParticles(canvas,opts){
  const ctx=canvas.getContext('2d');let W=0,H=0,pts=[],raf,ready=false;
  const cols=opts.colors, N=opts.count, link=opts.link, speed=opts.speed||0.4, rMax=opts.r||2.6;
  function resize(){
    const b=canvas.getBoundingClientRect();
    if(b.width<2||b.height<2)return;
    const nw=Math.round(b.width), nh=Math.round(b.height);
    if(nw===W&&nh===H)return; // no real change → skip (prevents loops)
    W=nw;H=nh;
    canvas.width=W*devicePixelRatio;canvas.height=H*devicePixelRatio;
    ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
    if(!ready){ // seed particles once we know the size
      pts=[];for(let i=0;i<N;i++)pts.push({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*speed,vy:(Math.random()-.5)*speed,r:Math.random()*rMax+.6,c:cols[i%cols.length],a:Math.random()*.5+.25,tw:Math.random()*Math.PI*2});
      ready=true;
    }
  }
  function draw(){
    if(ready&&W>0){
      ctx.clearRect(0,0,W,H);
      if(link){for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=Math.hypot(dx,dy);if(d<link){ctx.globalAlpha=(1-d/link)*.14;ctx.strokeStyle=pts[i].c;ctx.lineWidth=.6;ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();}}}
      ctx.globalAlpha=1;
      for(const p of pts){p.x+=p.vx;p.y+=p.vy;p.tw+=0.04;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;const tw=(Math.sin(p.tw)+1)/2;ctx.globalAlpha=p.a*(0.5+tw*0.6);ctx.fillStyle=p.c;ctx.shadowBlur=8;ctx.shadowColor=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();}
      ctx.shadowBlur=0;ctx.globalAlpha=1;
    }
    raf=requestAnimationFrame(draw);
  }
  // initial size after layout settles
  requestAnimationFrame(()=>{resize();draw();});
  let rt;
  const onResize=()=>{clearTimeout(rt);rt=setTimeout(resize,150);};
  window.addEventListener('resize',onResize);
  return {stop(){cancelAnimationFrame(raf);window.removeEventListener('resize',onResize);}, resize};
}

function fmt(n){return '₹'+Math.round(n).toLocaleString('en-IN');}
function emiCalc(P,annualRate,months){const r=annualRate/12/100;const e=P*r*Math.pow(1+r,months)/(Math.pow(1+r,months)-1);return Math.round(e);}

// ── Rupee in words (Indian system) ──
function rupeesInWords(num){
  num=Math.round(num);if(num===0)return 'Zero Rupees';
  const a=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const b=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function two(n){return n<20?a[n]:b[Math.floor(n/10)]+(n%10?' '+a[n%10]:'');}
  function three(n){return (Math.floor(n/100)?a[Math.floor(n/100)]+' Hundred'+(n%100?' ':''):'')+(n%100?two(n%100):'');}
  let out='',cr=Math.floor(num/10000000);num%=10000000;let lk=Math.floor(num/100000);num%=100000;let th=Math.floor(num/1000);num%=1000;let hu=num;
  if(cr)out+=three(cr)+' Crore ';if(lk)out+=three(lk)+' Lakh ';if(th)out+=three(th)+' Thousand ';if(hu)out+=three(hu);
  return out.trim()+' Rupees';
}

// ── Real decision engine: FOIR-driven ──
function riskRate(cibil){ // base APR by bureau band
  if(cibil>=780)return 12.5; if(cibil>=750)return 13.5; if(cibil>=700)return 15.5;
  if(cibil>=670)return 16.5; if(cibil>=640)return 18.0; return 22.0;
}
function assess(){
  const p=PROFILES[state.profile];
  const lender=LENDERS.find(l=>l.id===state.lender);
  const income=state.userIncome||p.income;
  let rate=riskRate(p.cibil)+(lender?lender.rateAdj:0);
  rate=Math.max(10.5,Math.round(rate*10)/10); // floor + 1 decimal
  const reqEmi=emiCalc(state.amount,rate,state.tenure);
  const foir=(p.obligations+reqEmi)/income; // fraction
  const FOIR_MAX=0.50; // policy ceiling
  // Max EMI room under policy, then max principal that fits it
  const emiRoom=Math.max(0,income*FOIR_MAX-p.obligations);
  const r=rate/12/100, n=state.tenure;
  const maxPrincipal=emiRoom>0?Math.floor(emiRoom*(Math.pow(1+r,n)-1)/(r*Math.pow(1+r,n))/1000)*1000:0;
  let outcome, offerAmt, verdict, reasons=[];
  if(p.defaults>0 && p.cibil<650){
    outcome='declined';offerAmt=0;
    verdict=`Recent repayment defaults and a bureau score of ${p.cibil} fall below our credit policy. We can't extend an offer right now.`;
    reasons=[['Bureau score',p.cibil+' · below 650 cut-off','bad'],['Recent defaults',p.defaults+' in last 6 months','bad'],['FOIR at request',(foir*100).toFixed(0)+'% · over 50% ceiling','bad']];
  } else if(foir<=FOIR_MAX && state.amount<=maxPrincipal){
    outcome='approved';offerAmt=state.amount;
    verdict=`Your obligations after this loan stay within a healthy ${(foir*100).toFixed(0)}% of income. Full amount approved.`;
    reasons=[['Bureau score',p.cibil+' · '+(p.cibil>=750?'excellent':'good'),'good'],['FOIR after loan',(foir*100).toFixed(0)+'% · within 50%','good'],['Verified income',fmt(income)+'/mo','good']];
  } else if(maxPrincipal>=25000){
    // amount too big for FOIR → reduce, or gig → conditional
    offerAmt=Math.min(maxPrincipal,state.amount);
    const newFoir=(p.obligations+emiCalc(offerAmt,rate,state.tenure))/income;
    if(p.variable){
      outcome='review';
      verdict=`Income verified via UPI cashflow but it's variable, so a manual check is needed. Conditional offer of ${fmt(offerAmt)} at ${newFoir*100<=50?(newFoir*100).toFixed(0):'~50'}% FOIR.`;
      reasons=[['Bureau score',p.cibil+' · good','good'],['Income stability','Variable · needs review','warn'],['FOIR at offer',(newFoir*100).toFixed(0)+'%','warn']];
    } else {
      outcome='approved';
      verdict=`Requested ${fmt(state.amount)} would push FOIR past our 50% ceiling. Approved for ${fmt(offerAmt)}, which keeps you at a safe ${(newFoir*100).toFixed(0)}%.`;
      reasons=[['Bureau score',p.cibil+' · good','good'],['FOIR if full amount',(foir*100).toFixed(0)+'% · too high','warn'],['FOIR at offer',(newFoir*100).toFixed(0)+'% · within policy','good']];
    }
  } else {
    outcome='declined';offerAmt=0;
    verdict=`Existing obligations already consume most of your income (FOIR ${(foir*100).toFixed(0)}%). There isn't room for another EMI right now.`;
    reasons=[['FOIR at request',(foir*100).toFixed(0)+'% · over 50% ceiling','bad'],['Existing EMIs',fmt(p.obligations)+'/mo','bad'],['Room for new EMI',fmt(emiRoom)+'/mo','bad']];
  }
  return {income,rate,reqEmi,foir,offerAmt,outcome,verdict,reasons,maxPrincipal,lender,feePct:(lender?lender.fee:2.0)};
}

function loanSchedule(){
  const a=state.calc||assess(); const principal=state.finalAmt||a.offerAmt||state.amount;
  const rate=(state.finalRate||a.rate||12.5)/100/12; const emi=emiCalc(principal,state.finalRate||a.rate||12.5,state.tenure);
  let bal=principal, rows=[];
  for(let m=1;m<=state.tenure;m++){const interest=Math.round(bal*rate);const principalPart=Math.max(0,Math.round(emi-interest));const opening=bal;bal=Math.max(0,bal-principalPart);rows.push({m,opening,interest,principal:principalPart,balance:bal});}
  return {principal,emi,rows};
}

}

</div>

function runDisburse(){let i=0;const items=document.querySelectorAll('.fetch-item');const iv=setInterval(()=>{if(i<items.length){items[i].classList.add('done');items[i].querySelector('.fetch-status').innerHTML='<div class="check">'+IC.check+'</div>';i++;}else{clearInterval(iv);setTimeout(()=>goName('success'),500);}},800);}

function rSuccess(){const p=PROFILES[state.profile];const a=state.calc||assess();const emi=emiCalc(state.finalAmt,state.finalRate,state.tenure);const feePct=a.feePct||2;const feeAmt=Math.round(state.finalAmt*feePct/100);const lname=a.lender?a.lender.name:'TezCredit';const txnId='TEZ'+Date.now().toString().slice(-9);const d=new Date();return `<div class="pad step-anim" style="position:relative">
<div style="text-align:center;padding:16px 0 8px"><div class="decision-icon" style="background:var(--green-soft);color:var(--green);width:72px;height:72px">${ico('check')}</div></div>
<div class="h1" style="text-align:center">Money's on its way${state.name.trim()?', '+state.name.trim().split(' ')[0]:''}!</div>
<div class="success-amt">${fmt(state.finalAmt)}</div>
<div class="offer-words" style="text-align:center;color:var(--muted);margin-bottom:6px">${rupeesInWords(state.finalAmt)}</div>

<div class="receipt-row"><span class="k">Amount disbursed</span><span class="v">${fmt(state.finalAmt-feeAmt)}</span></div>
<div class="receipt-row"><span class="k">Processing fee</span><span class="v">-${fmt(feeAmt)}</span></div>
<div class="receipt-row"><span class="k">Interest rate</span><span class="v">${state.finalRate}% p.a.</span></div>
<div class="receipt-row"><span class="k">First EMI</span><span class="v">${fmt(emi)}</span></div>
<div class="receipt-row"><span class="k">Mode</span><span class="v">UPI / IMPS</span></div>
<div class="receipt-row"><span class="k">Date</span><span class="v">${d.toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})}</span></div>
</div>
<div class="timeline"><div class="tl-item"><div class="tl-dot">${ico('check')}</div><div class="tl-tx"><div class="t">Loan disbursed by ${lname}</div><div class="d">Just now</div></div></div>
<div class="tl-item"><div class="tl-dot" style="background:var(--indigo)">${ico('calendar')}</div><div class="tl-tx"><div class="t">First EMI on ${new Date(d.getFullYear(),d.getMonth()+1,5).toLocaleDateString('en-IN',{day:'2-digit',month:'short'})}</div><div class="d">${fmt(emi)} via UPI Autopay</div></div></div></div>
<div class="sim-banner" style="margin:4px 0 14px">${ico('warn')}<span>Simulated disbursal — no real funds were transferred.</span></div>
<button class="btn btn-primary" onclick="goName('dashboard')">View loan dashboard ${ico('arrow')}</button>
<button class="btn btn-ghost btn-sm" style="margin-top:10px" onclick="goName('profile')">Run another borrower</button>
<div class="badge-row" style="justify-content:center;margin-top:16px"><div class="trust-badge">${ico('shield')} RBI compliant</div><div class="trust-badge">${ico('lock')} DPDP 2023</div><div class="trust-badge">${ico('check')} Digital lending norms</div></div>
</div>`;}

function fireConfetti(){const cols=['#FF6B35','#2D3E8C','#178A4C','#D98A00','#0E8388'];const phone=document.querySelector('.phone');for(let i=0;i<40;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'%';c.style.background=cols[i%cols.length];c.style.animationDelay=Math.random()*0.5+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';phone.appendChild(c);setTimeout(()=>c.remove(),3000);}}

render();
